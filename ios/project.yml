name: DailyX
options:
  bundleIdPrefix: com.okayrulez
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: tr
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # eMudhra embedded trust-store security fix; do not lower this floor.
    from: 12.19.3
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
targets:
  DailyXApp:
    type: application
    platform: iOS
    sources:
      - path: DailyApp
        excludes: [BundledFirebase.plist, GoogleService-Info.plist]
      - path: DailyAppleShared
    entitlements:
      path: DailyApp/dAIly.entitlements
      properties:
        aps-environment: $(DAILY_APNS_ENVIRONMENT)
        com.apple.security.application-groups: [group.com.okayrulez.daily]
    info:
      path: DailyApp/Info.generated.plist
      properties:
        CFBundleDisplayName: dAIly
        CFBundleLocalizations: [tr, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        DailyAPNsEnvironment: $(DAILY_APNS_ENVIRONMENT)
        DailyGoogleOAuthClientID: "$(DAILY_GOOGLE_OAUTH_CLIENT_ID)"
        NSAlarmKitUsageDescription: dAIly, onayladığın planlar için bu iPhone’da alarm kurar.
        NSCalendarsFullAccessUsageDescription: dAIly, onayladığın planları Apple Takvim’e ekler ve bu kayıtları sen istediğinde günceller veya kaldırır.
        NSRemindersFullAccessUsageDescription: dAIly, seçtiğin etkinliği Apple Anımsatıcılar’a ekler.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [dailyx]
          - CFBundleURLSchemes: ["$(DAILY_GOOGLE_URL_SCHEME)"]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: DailyCore
      - target: DailyWidgets
      - sdk: AlarmKit.framework
        weak: true
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        DAILY_APNS_ENVIRONMENT: development
        INFOPLIST_KEY_DailyAPNsEnvironment: $(DAILY_APNS_ENVIRONMENT)
        PRODUCT_BUNDLE_IDENTIFIER: com.okayrulez.daily
        PRODUCT_NAME: DailyX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        DAILY_GOOGLE_URL_SCHEME: "dailyx-google-unconfigured"
        DAILY_GOOGLE_OAUTH_CLIENT_ID: ""
      configs:
        Release:
          DAILY_APNS_ENVIRONMENT: production
  DailyWidgets:
    type: app-extension
    platform: iOS
    sources: [DailyWidgets, DailyAppleShared]
    entitlements:
      path: DailyWidgets/DailyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.okayrulez.daily]
    info:
      path: DailyWidgets/Info.generated.plist
      properties:
        CFBundleDisplayName: dAIly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okayrulez.daily.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  DailyCore:
    type: framework
    platform: iOS
    sources:
      - path: DailyCore
        excludes: [Resources]
      - path: DailyCore/Resources
        buildPhase: resources
    dependencies:
      - sdk: JavaScriptCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okayrulez.daily.core
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
  DailyCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailyCoreTests
        excludes: [Resources]
      - path: DailyCoreTests/Resources
        buildPhase: resources
    dependencies:
      - target: DailyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okayrulez.daily.core-tests
        CODE_SIGNING_ALLOWED: NO
  DailyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DailyAppUITests]
    dependencies:
      - target: DailyXApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okayrulez.daily.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DailyXApp
        CODE_SIGNING_ALLOWED: NO
schemes:
  DailyX:
    build:
      targets:
        DailyXApp: all
    archive:
      config: Release
  DailyX-CI:
    build:
      targets:
        DailyCore: all
        DailyCoreTests: [test]
        DailyAppUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: DailyCoreTests
        - name: DailyAppUITests
